<html>
    <head>
        <link rel="stylesheet" href="./reset.css"/>
        <meta charset="utf-8">
        <style>
            /* CSS här inne */     
            .box {
                width: 200px;
                height: 200px;

                /* Ovning 4 */
                margin: 1.5rem;
                padding: 1rem;
                font-size: 20px;

                border: 2px solid black;
                box-shadow: 0 4px 8px rgba(0,0,0,.1);
            }


            /* förälderlådan - fast width */
            .parent {
                background: orange;
                width: 500px;
                height: 100px;
            }

            /* 80% av föräldern */
            .child {
                background: lightpink;
                width: 80%;
                height: 50%;
                max-width: 600px;
                margin: 0 auto;
            }
        </style>
    </head>
    <body>

        <div class="box">
            Hej, detta är text.
        </div>
    </body>
</html>
